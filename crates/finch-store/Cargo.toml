[package]
name = "finch-store"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
finch-core = { path = "../finch-core" }
crossbeam-channel = "=0.5.15"
directories = "=6.0.0"
file-id = "=0.2.3"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
thiserror = "=2.0.17"
