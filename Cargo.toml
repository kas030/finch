[workspace]
members = ["crates/finch-core", "crates/finch-pdf", "crates/finch-store", "crates/finch-plugin-api", "crates/finch-plugin", "crates/finch-app", "examples/text-stats"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
finch-core = { path = "crates/finch-core" }
finch-pdf = { path = "crates/finch-pdf" }
finch-store = { path = "crates/finch-store" }
finch-plugin = { path = "crates/finch-plugin" }
finch-plugin-api = { version = "0.1.0", path = "crates/finch-plugin-api" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
